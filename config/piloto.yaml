# =============================================================================
# PILOTO (hito H4, sección 3.4.7) — repositorios públicos reales de los dos grupos:
#   grupo A: sin pruebas preexistentes          grupo B: con suite de pruebas preexistente
# Estos repos NO van a formar parte del conjunto final (para no sesgar el ajuste de parámetros).
#
# Modelo: Gemini (plan gratuito). Para cambiarlo sin tocar este archivo:
#   python -m pipeline ejecutar config/piloto.yaml --modelo gemini/NOMBRE
# (los nombres vigentes para tu clave se ven con:  python -m pipeline modelos)
#
# AVISO: kodi-cli y vertopal-cli son clientes de servicios externos; el criterio de
# inclusión excluye ese tipo de proyectos. Revisarlos a mano antes de usarlos como dato.
# =============================================================================
experimento:
  nombre: piloto
  corridas_por_repo: 1          # piloto: 1 corrida; experimento final: 3 (Tabla 8)
  carpeta_resultados: resultados

llm:
  modelo: gemini/gemini-3.6-flash   # nombre vigente: python -m pipeline modelos
  # gemini-3.6-flash, plan pago (USD por millón de tokens, listado público al 29/10/2026;
  # confirmar en https://ai.google.dev/pricing). Con precios en 0 el límite de costo no actúa.
  entrada_usd_por_millon: 0.75
  salida_usd_por_millon: 3.75

herramienta:
  qodo_cover_commit: adcf55baba40e8fbf8a84e68b70d08bef1e2b9c9
  max_iteraciones: 3
  cobertura_deseada: 100
  ejecuciones_por_prueba: 5
  timeout_prueba_seg: 30
  max_modulos: 3                # pocos módulos: el plan gratuito tiene límite de pedidos por minuto
  timeout_modulo_min: 20
  # Consumo del modelo (docker/tesis_llm.py). Mismo valor para los dos grupos; queda registrado (RNF-05).
  razonamiento: low             # «thinking» de Gemini acotado; "" = el que trae el modelo
  analisis_fallas: local        # por qué falló una prueba: con la salida de pytest, sin consultar a la IA

limites:
  limite_costo_repo_usd: 1.00
  tiempo_max_repo_min: 60
  cpus: 2
  memoria: 4g

criterios:
  lineas_min: 500
  lineas_max: 5000
  actividad_min_dias: 365
  cobertura_a_max: 10           # grupo A: cobertura inicial nula o menor al 10%
  cobertura_b_min: 20           # grupo B: entre 20% y 80% (umbrales tentativos, sección 2.3)
  cobertura_b_max: 80

repositorios:
  - nombre: kodi-cli
    grupo: A
    url: https://github.com/JavaWiz1/kodi-cli.git
    commit: 71ca9e10add28cefae919a3f3fc2adf47f7fa445
    fuente: kodi_cli
  - nombre: pyckify
    grupo: A
    url: https://github.com/ReiDoBrega/pyckify.git
    commit: 7847a97e0866d85f6188c49eec3919e9b59cff63
    fuente: pyckify
  - nombre: vertopal-cli
    grupo: A
    url: https://github.com/vertopal/vertopal-cli.git
    commit: 1dee702620b6ba7e6370df66f7cd04f2a2baf65f
    fuente: src/vertopal
  # --- Grupo B ---------------------------------------------------------------------------------
  # Verificado el 01/11/2026: se instala solo, sus 31 pruebas pasan y cubren el 63% del código.
  # Para sumar más proyectos B:  python -m pipeline buscar --grupo B
  # (opcional) archivos_prueba: {ruta/del/modulo.py: tests/test_modulo.py} si la asociación automática no alcanza
  - nombre: nb-autodoc
    grupo: B
    url: https://github.com/nonebot/nb-autodoc.git
    commit: a49c34fb082ef4f47255eee58b14f876f5989498
    fuente: nb_autodoc
